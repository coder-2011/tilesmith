<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">Tilesmith controlled RMSNorm benchmark on an NVIDIA L4</title>
  <desc id="description">Horizontal bar chart. Eager PyTorch takes 2.173 milliseconds, the four-launch generated baseline takes 1.042 milliseconds, the first accepted candidate takes 0.370 milliseconds, and fresh confirmation takes 0.371 milliseconds. Lower is better.</desc>
  <defs>
    <linearGradient id="baseline" x1="0" x2="1">
      <stop offset="0" stop-color="#7c8aa5"/>
      <stop offset="1" stop-color="#a9b4c8"/>
    </linearGradient>
    <linearGradient id="optimized" x1="0" x2="1">
      <stop offset="0" stop-color="#14b8a6"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="560" rx="24" fill="#0b1020"/>
  <text x="54" y="62" fill="#f8fafc" font-family="ui-sans-serif, system-ui, sans-serif" font-size="28" font-weight="700">Controlled RMSNorm benchmark · NVIDIA L4</text>
  <text x="54" y="96" fill="#94a3b8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="17">4096 × 4096 FP16 · median CUDA-event latency · lower is better</text>

  <line x1="318" y1="130" x2="318" y2="448" stroke="#334155" stroke-width="2"/>
  <line x1="318" y1="448" x2="1110" y2="448" stroke="#334155" stroke-width="2"/>
  <g fill="#64748b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="13">
    <text x="312" y="472" text-anchor="middle">0</text>
    <text x="494" y="472" text-anchor="middle">0.5</text>
    <text x="676" y="472" text-anchor="middle">1.0</text>
    <text x="858" y="472" text-anchor="middle">1.5</text>
    <text x="1040" y="472" text-anchor="middle">2.0 ms</text>
  </g>
  <g stroke="#1e293b" stroke-width="1">
    <line x1="494" y1="130" x2="494" y2="448"/>
    <line x1="676" y1="130" x2="676" y2="448"/>
    <line x1="858" y1="130" x2="858" y2="448"/>
    <line x1="1040" y1="130" x2="1040" y2="448"/>
  </g>

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="290" y="174" text-anchor="end" fill="#cbd5e1" font-size="17">Eager PyTorch</text>
    <rect x="318" y="149" width="791" height="36" rx="8" fill="url(#baseline)"/>
    <text x="1095" y="174" text-anchor="end" fill="#0b1020" font-size="16" font-weight="700">2.173 ms</text>

    <text x="290" y="252" text-anchor="end" fill="#cbd5e1" font-size="17">Generated baseline</text>
    <text x="290" y="273" text-anchor="end" fill="#64748b" font-size="13">4 repeated launches</text>
    <rect x="318" y="227" width="379" height="36" rx="8" fill="url(#baseline)"/>
    <text x="711" y="252" fill="#cbd5e1" font-size="16" font-weight="700">1.042 ms</text>

    <text x="290" y="330" text-anchor="end" fill="#cbd5e1" font-size="17">Accepted candidate</text>
    <rect x="318" y="305" width="135" height="36" rx="8" fill="url(#optimized)"/>
    <text x="467" y="330" fill="#5eead4" font-size="16" font-weight="700">0.370 ms</text>

    <text x="290" y="408" text-anchor="end" fill="#f8fafc" font-size="17" font-weight="700">Fresh confirmation</text>
    <rect x="318" y="383" width="135" height="36" rx="8" fill="url(#optimized)"/>
    <text x="467" y="408" fill="#5eead4" font-size="16" font-weight="700">0.371 ms</text>
  </g>

  <rect x="54" y="503" width="1092" height="1" fill="#1e293b"/>
  <text x="54" y="535" fill="#5eead4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="18" font-weight="700">64.99% lower normalized latency ratio after independent confirmation</text>
</svg>
