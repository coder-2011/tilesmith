[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tilesmith-ai"
version = "0.1.3"
description = "Validate agent-optimized TorchInductor CUDA wrappers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.1,<0.8",
    "langchain-openai>=1.4.1,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tilesmith = ["sandboxes/*.cjs"]

[tool.ruff]
target-version = "py311"
line-length = 150

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "D",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]
